<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Profile — Helping.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.modal-overlay{ position:fixed; inset:0; background:rgba(10,24,48,.5); display:none; align-items:center; justify-content:center; z-index:80; padding:20px; }
.modal-overlay.is-open{ display:flex; }
.modal-box{ background:#fff; border-radius: var(--radius-l); padding:28px; max-width:460px; width:100%; max-height:90vh; overflow:auto; }
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-row">
    <a href="index.html" class="brand"><span class="brand-mark"></span>Helping.com</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="nearby.html">Nearby</a></li>
      <li><a href="help-now.html">Help Now</a></li>
      <li><a href="account.html">Account</a></li>
    </ul>
    <div class="nav-actions">
      <span data-nav-auth></span>
      <button class="nav-toggle" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</nav>

<div class="section" id="pageBody"></div>

<footer class="site-footer">
  <div class="container footer-row">
    <div><div class="brand" style="margin-bottom:6px;"><span class="brand-mark"></span>Helping.com</div><div class="footer-tag">Whatever you need. Help is nearby.</div></div>
    <div class="footer-links"><a href="about.html">About Us</a><a href="how-it-works.html">How It Works</a></div>
  </div>
</footer>

<nav class="bottom-nav">
  <div class="bottom-nav-row"><a href="index.html">Home</a><a href="services.html">Services</a><a href="nearby.html">Nearby</a><a href="help-now.html">Help</a><a href="account.html">Account</a></div>
</nav>

<div class="modal-overlay" id="requestModal">
  <div class="modal-box">
    <h3>Request Service</h3>
    <form id="requestForm">
      <div class="field"><label>Provider</label><input id="rProvider" disabled></div>
      <div class="field"><label>Preferred time</label><input type="text" placeholder="e.g. Today, 5:00 PM" required></div>
      <div class="field"><label>Notes for the provider</label><textarea rows="3" placeholder="Briefly describe the issue"></textarea></div>
      <div class="field"><label>Estimated price</label><input id="rPrice" disabled></div>
      <button type="submit" class="btn btn-primary btn-block">Confirm Request</button>
      <button type="button" class="btn btn-ghost btn-block" id="closeModal" style="margin-top:8px;">Cancel</button>
    </form>
  </div>
</div>

<script src="js/session.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const provider = getProviderById(params.get("id")) || PROVIDERS[0];
  const svc = getServiceById(provider.service);
  document.title = provider.name + " — Helping.com";

  document.getElementById("pageBody").innerHTML = `
    <div class="container" style="display:grid;grid-template-columns:1fr 320px;gap:26px;">
      <div>
        <div class="card-panel" style="display:flex;gap:20px;flex-wrap:wrap;">
          <div class="provider-thumb" style="width:96px;height:96px;background:${provider.img};border-radius:22px;"></div>
          <div style="flex:1;min-width:220px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <h1 style="font-size:1.5rem;margin:0;">${provider.name}</h1>
              ${provider.verified ? '<span class="badge badge-verified">✓ Verified</span>' : ''}
              <span class="badge ${provider.open ? 'badge-open':'badge-closed'}">${provider.open ? 'Open':'Closed'}</span>
            </div>
            <p style="margin:6px 0;">${svc.name} · ${provider.area}</p>
            <div class="stat-row">
              <span>${starLine(provider.rating)} <b>${provider.rating}</b> (${provider.reviews} reviews)</span>
              <span>Experience: <b>${provider.experience}</b></span>
              <span>Responds in <b>${provider.response}</b></span>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <h2 style="font-size:1.15rem;">About</h2>
        <p>${provider.about}</p>

        <h2 style="font-size:1.15rem;">Services offered</h2>
        <div class="tag-row" style="margin-bottom:20px;">${provider.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>

        <h2 style="font-size:1.15rem;">Pricing &amp; availability</h2>
        <div class="grid grid-3" style="margin-bottom:20px;">
          <div class="card-panel"><div style="font-size:.8rem;color:var(--text-faint);">Starting price</div><b>${provider.price ? '₹'+provider.price : 'Varies'}</b></div>
          <div class="card-panel"><div style="font-size:.8rem;color:var(--text-faint);">Hours</div><b>${provider.hours}</b></div>
          <div class="card-panel"><div style="font-size:.8rem;color:var(--text-faint);">Service area</div><b>${provider.area}</b></div>
        </div>

        <h2 style="font-size:1.15rem;">Reviews</h2>
        <div id="reviewsWrap" class="card-panel"></div>
      </div>

      <aside>
        <div class="card-panel" id="request" style="position:sticky;top:84px;">
          <h3 style="font-size:1.05rem;">Get help from ${provider.name.split(" ")[0]}</h3>
          <p style="font-size:.88rem;">Starting at ${provider.price ? '₹'+provider.price : 'a price that varies'}, usually responds in ${provider.response}.</p>
          <button class="btn btn-primary btn-block" id="openRequest">Request Service</button>
          <a href="tel:+910000000000" class="btn btn-outline btn-block" style="margin-top:8px;">Call Now</a>
          <a href="account.html" class="btn btn-ghost btn-block" style="margin-top:8px;">Contact via Account</a>
        </div>
      </aside>
    </div>`;

  const reviews = getReviews(provider.id);
  document.getElementById("reviewsWrap").innerHTML = reviews.length
    ? reviews.map(r => `<div class="review-card"><div style="display:flex;justify-content:space-between;"><b>${r.user}</b>${starLine(r.rating)}</div><p style="margin:6px 0 0;">${r.text}</p></div>`).join("")
    : `<div class="empty-state" style="padding:20px;"><p style="margin:0;">No reviews yet for this demo provider.</p></div>`;

  const modal = document.getElementById("requestModal");
  document.getElementById("openRequest").addEventListener("click", () => {
    const user = Session.currentUser();
    if (!user){
      toast("Please log in to request a service.");
      window.location.href = "login.html?next=provider.html?id=" + provider.id;
      return;
    }
    document.getElementById("rProvider").value = provider.name;
    document.getElementById("rPrice").value = provider.price ? "₹" + provider.price + " onwards" : "Varies";
    modal.classList.add("is-open");
  });
  document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("is-open"));

  document.getElementById("requestForm").addEventListener("submit", e => {
    e.preventDefault();
    const user = Session.currentUser();
    const inputs = e.target.querySelectorAll("input:not([disabled]), textarea");
    Session.addRequest(user.id, {
      providerId: provider.id,
      providerName: provider.name,
      service: svc.name,
      time: inputs[0].value,
      notes: inputs[1].value,
      price: provider.price ? "₹" + provider.price + " onwards" : "Varies",
    });
    modal.classList.remove("is-open");
    toast("Request submitted successfully.", "success");
    setTimeout(() => window.location.href = "account.html#requests", 900);
  });
</script>
</body>
</html>
